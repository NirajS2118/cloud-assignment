apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: command-parser-ingress
  namespace: app
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: command-parser
                port:
                  number: 8000

