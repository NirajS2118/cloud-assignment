name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      evaluate_bad_model:
        description: 'Set to true to evaluate untrained model (demonstrates quality gate rejection)'
        required: false
        type: boolean
        default: false

jobs:
  # Stage 1: Linting
  lint:
    name: 1. Code Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8 Linter
        run: |
          flake8 service/ worker/ training/ tests/ tools/ --max-line-length=120 --ignore=E501,W503

  # Stage 2: Unit Tests (At least 3 tests)
  unit-tests:
    name: 2. Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r service/requirements.txt httpx jsonschema

      - name: Run Unit Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

  # Stage 3 & 4: Model Evaluation and Quality Gate
  evaluate-and-quality-gate:
    name: 3 & 4. Model Evaluation & Quality Gate
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Evaluation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Download Model Artifact from GitHub Release
        id: download-model
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p models/eval_model
          echo "Attempting to download model assets from GitHub Release v1..."
          gh release download v1 --repo ${{ github.repository }} --dir models/eval_model || true
          if [ -f models/eval_model/model.safetensors ]; then
            echo "Release asset downloaded successfully."
            sha256sum models/eval_model/model.safetensors
          fi

      - name: Run Evaluation Predictions
        run: |
          if [ "${{ github.event.inputs.evaluate_bad_model }}" = "true" ]; then
            echo "Running deliberately bad model test..."
            python tools/ci_eval.py --bad-model --out eval_predictions.jsonl
          else
            echo "Running student model evaluation..."
            python tools/ci_eval.py --out eval_predictions.jsonl
          fi

      # Stage 4: Quality Gate (--min-validity 95)
      - name: Quality Gate (Minimum JSON Validity 95%)
        run: |
          python tools/score.py eval_predictions.jsonl data/validation.jsonl --min-validity 95 --out results/ci_evaluation_report.json

  # Stage 5: Secret Scanning (Gitleaks)
  secret-scan:
    name: 5. Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
